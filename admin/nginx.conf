# Admin & doctor panel: serves the built React SPA and proxies /api to the
# backend container, so the browser only ever talks to this one origin.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API caps uploads at 2 MB; reject anything much larger at the edge.
    client_max_body_size 3m;

    # Docker's embedded DNS, re-resolved so a restarted backend is still found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Scripts only from this origin: an injected <script> cannot run and read
    # the admin/doctor JWT in localStorage. Inline styles are needed by
    # react-toastify.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append, so a client cannot smuggle in its own
        # X-Forwarded-For chain; the API trusts exactly one hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (e.g. /admin-dashboard) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
